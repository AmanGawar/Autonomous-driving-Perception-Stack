name: perception_stack
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - scipy=1.12.0
  - opencv=4.9.0
  - pip
  - pip:
      - ultralytics>=8.1.0
      - onnx>=1.15.0
      - onnxruntime-gpu>=1.17.0
      - wandb>=0.16.5
      - pytest>=8.0.0
